
version: '3.8'
services:
  postgres:
    image: postgres:latest
    container_name: postgres_container

    env_file:
      - .env
    ports:
      - "${POSTGRES_PORT}:5432"             
    volumes:
      - "${POSTGRES_DATA_DIR}:/var/lib/postgresql/data" # Persist PostgreSQL data

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin_container
    env_file:
      - .env         
    ports:
      - "${PGADMIN_PORT}:80"                
    depends_on:
      - postgres                 
    volumes:
       - "${PGADMIN_DEFAULT_DIR}:/var/lib/pgadmin" # Persist pgAdmin data

